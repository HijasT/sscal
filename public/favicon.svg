<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9184c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#584c86;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" opacity="0.95"/>
  
  <!-- Inner ring for depth -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Modern bar chart with 3 bars -->
  <g transform="translate(64, 64)">
    <!-- Bar 1 (shortest) -->
    <rect x="-28" y="5" width="14" height="20" rx="2" fill="url(#chartGradient)" opacity="0.8"/>
    <!-- Bar 2 (medium) -->
    <rect x="-7" y="-10" width="14" height="35" rx="2" fill="url(#chartGradient)"/>
    <!-- Bar 3 (tallest) -->
    <rect x="14" y="-25" width="14" height="50" rx="2" fill="url(#chartGradient)" opacity="0.9"/>
    
    <!-- Upward arrow trend -->
    <path d="M -25 8 L 25 -22" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 18 -24 L 25 -22 L 23 -15" fill="white" opacity="0.7"/>
    
    <!-- Dollar sign overlay (small) -->
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
          fill="white" text-anchor="middle" opacity="0.9">$</text>
  </g>
  
  <!-- Subtle outer glow -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
</svg>
