name: Vendor requested Nailed It GIF
on:
  push:
    branches:
      - ui/replace-target-trophy-with-nailed-it
    paths:
      - .github/workflows/vendor-nailed-it.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact captioned GIF from verified source
        run: |
          mkdir -p public
          curl --fail --location --retry 3 --silent --show-error \
            'https://media1.tenor.com/m/tWdqNWk5XMwAAAAd/nailed-it-the-office.gif' \
            --output public/nailed-it.gif
          test "$(head -c 3 public/nailed-it.gif)" = GIF
          test "$(wc -c < public/nailed-it.gif)" -gt 10000
      - name: Commit the media asset to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/nailed-it.gif
          git commit -m 'assets: vendor exact Office Nailed It GIF' || exit 0
          git push origin HEAD:ui/replace-target-trophy-with-nailed-it
