name: Kleon quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit, XLSX, types, build and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and XLSX integration tests
        run: npm test
      - name: Test coverage summary
        run: npm run test:coverage
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install browser-test tooling (CI-only, pinned)
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1 pdfjs-dist@4.10.38
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Upload, calculation and CSV/PDF browser tests
        run: npm run test:e2e
      - name: Retain browser failures for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
